<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portal de Navios</title>
  <style>
    :root {
      --fundo: #f6f7f9; --cartao: #fff; --texto: #1c2430; --suave: #5b6675; --borda: #dfe3e8; --destaque: #0b6e99; --destaque-texto: #fff;
      --erro: #b42318; --c-cinza: #eceff3; --t-cinza: #3d4654; --c-azul: #e3edfb; --t-azul: #1f4f8f; --c-amarelo: #fbf3c4; --t-amarelo: #6b5600;
      --c-laranja: #ffe3c7; --t-laranja: #7a3d00; --c-verde: #dcf3e2; --t-verde: #1d6236; --c-vermelho: #fde2e0; --t-vermelho: #8f1f17;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fundo: #12161c; --cartao: #1a2029; --texto: #e6e9ee; --suave: #9aa5b4; --borda: #2c3542; --destaque: #3fa3d1; --destaque-texto: #0b1218;
        --erro: #ff8a7a; --c-cinza: #262d38; --t-cinza: #c3cad4; --c-azul: #1f2f4a; --t-azul: #b9d1f5; --c-amarelo: #3f3708; --t-amarelo: #f3e39a;
        --c-laranja: #4a2c0c; --t-laranja: #ffcf9f; --c-verde: #163323; --t-verde: #a6e3bb; --c-vermelho: #43191a; --t-vermelho: #ffb9b2;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--fundo); color: var(--texto); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { max-width: 1280px; margin: 0 auto; padding: 20px 16px 48px; }
    header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 14px; }
    h1 { font-size: 21px; margin: 0; }
    h2 { font-size: 15px; margin: 0 0 8px; }
    .suave { color: var(--suave); font-size: 13px; }
    .erro { color: var(--erro); }
    section { background: var(--cartao); border: 1px solid var(--borda); border-radius: 10px; padding: 14px; margin-bottom: 14px; }
    .cartoes { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
    .cartoes button { text-align: left; background: var(--cartao); color: var(--texto); border: 1px solid var(--borda); border-radius: 8px; padding: 9px 11px; cursor: pointer; font: inherit; }
    .cartoes button:hover { border-color: var(--destaque); }
    .cartoes strong { display: block; font-size: 22px; }
    .colunas { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
    .colunas ul { margin: 0; padding-left: 18px; }
    .colunas li { margin-bottom: 3px; }
    form { display: flex; flex-wrap: wrap; gap: 8px; align-items: end; }
    label { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--suave); }
    label.marcar { flex-direction: row; align-items: center; gap: 6px; padding-bottom: 7px; font-size: 13px; color: var(--texto); }
    input, select { font: inherit; padding: 6px 8px; border: 1px solid var(--borda); border-radius: 6px; background: var(--fundo); color: var(--texto); }
    button.acao { font: inherit; padding: 7px 13px; border: 0; border-radius: 6px; background: var(--destaque); color: var(--destaque-texto); cursor: pointer; }
    button.leve { font: inherit; padding: 6px 11px; border: 1px solid var(--borda); border-radius: 6px; background: transparent; color: var(--destaque); cursor: pointer; }
    .tabela { overflow-x: auto; margin-top: 10px; }
    table { border-collapse: collapse; width: 100%; font-size: 13px; }
    th, td { text-align: left; padding: 6px 7px; border-bottom: 1px solid var(--borda); vertical-align: top; white-space: nowrap; }
    th { color: var(--suave); font-weight: 500; position: sticky; top: 0; background: var(--cartao); }
    .pill { display: inline-block; padding: 0 7px; border-radius: 999px; font-size: 12px; white-space: nowrap; }
    .cinza { background: var(--c-cinza); color: var(--t-cinza); } .azul { background: var(--c-azul); color: var(--t-azul); }
    .amarelo { background: var(--c-amarelo); color: var(--t-amarelo); } .laranja { background: var(--c-laranja); color: var(--t-laranja); }
    .verde { background: var(--c-verde); color: var(--t-verde); } .vermelho { background: var(--c-vermelho); color: var(--t-vermelho); }
    a { color: var(--destaque); }
    button.nome { font: inherit; font-weight: 600; padding: 0; border: 0; background: none; color: var(--texto); cursor: pointer; text-align: left; }
    button.nome:hover { color: var(--destaque); text-decoration: underline; }
    .mudancas { list-style: none; margin: 0; padding: 0; }
    .mudancas li { padding: 5px 0; border-bottom: 1px solid var(--borda); }
    .mudancas li:last-child { border-bottom: 0; }
    .seta { color: var(--suave); padding: 0 4px; }
    .antigo { text-decoration: line-through; color: var(--suave); }
    dialog { width: min(760px, calc(100vw - 32px)); max-height: calc(100vh - 48px); border: 1px solid var(--borda); border-radius: 10px; padding: 0; background: var(--cartao); color: var(--texto); }
    dialog::backdrop { background: rgb(0 0 0 / 0.45); }
    .detalhe-topo { display: flex; justify-content: space-between; align-items: start; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--borda); position: sticky; top: 0; background: var(--cartao); }
    .detalhe-corpo { padding: 14px 16px; }
    .sequencia { list-style: none; margin: 0 0 18px; padding: 0; position: relative; }
    .sequencia li { display: grid; grid-template-columns: 18px 120px 1fr; gap: 8px; align-items: baseline; padding: 4px 0; }
    .ponto { width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--destaque); background: var(--cartao); margin-top: 4px; }
    .passou .ponto { background: var(--destaque); }
    .sem-data { color: var(--suave); }
    .agora { grid-template-columns: 18px 1fr !important; color: var(--destaque); font-size: 12px; font-weight: 600; }
    .agora .ponto { border-radius: 0; height: 2px; width: 14px; border: 0; background: var(--destaque); margin-top: 8px; }
  </style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>Portal de Navios</h1>
      <div class="suave">API Portal de Navios do DSS · horários de Brasília</div>
    </div>
    <div class="suave" id="status">Carregando…</div>
  </header>

  <section>
    <div class="cartoes" id="cartoes"></div>
  </section>

  <section>
    <h2>Próximas <span id="janela">48</span> horas</h2>
    <div class="colunas" id="proximas"></div>
  </section>

  <section>
    <h2>Mudanças nas últimas 24 horas</h2>
    <div id="mudancas"></div>
  </section>

  <section>
    <form id="filtros">
      <label>Terminal<select name="terminal"><option value="">Todos</option></select></label>
      <label>Armador<select name="armador"><option value="">Todos</option></select></label>
      <label>Navio<select name="situacao"><option value="">Todas</option><option value="previsto">Previsto</option><option value="aguardando_atracacao">Aguardando atracação</option><option value="chegada_passou">Chegada passou (sem dado de atracação)</option><option value="atracado">Atracado</option><option value="encerrado">Encerrado</option></select></label>
      <label>Gate<select name="gate"><option value="">Todos</option><option value="aguardando">Aguardando abertura</option><option value="aberto">Aberto</option><option value="encerrado">Encerrado</option><option value="sem_dado">Sem dado</option></select></label>
      <label>Busca (navio)<input name="navio" size="14" placeholder="MSC"></label>
      <label>Período<select name="dias"><option value="3">Próximos 3 dias</option><option value="7" selected>Próximos 7 dias</option><option value="14">Próximos 14 dias</option><option value="30">Próximos 30 dias</option><option value="">Tudo o que o DSS enviou</option></select></label>
      <label class="marcar"><input type="checkbox" name="encerrados" value="true"> Mostrar encerrados</label>
      <label>Ordenar<select name="ordenar"><option value="referencia">Atracação</option><option value="chegada">Chegada</option><option value="deadline">Deadline</option><option value="navio">Navio</option></select></label>
      <button class="acao" type="submit">Filtrar</button>
      <button class="leve" type="button" id="limpar">Limpar</button>
      <button class="leve" type="button" id="atualizar">Consultar o DSS agora</button>
    </form>
    <div id="tabela"></div>
    <p class="suave">Resposta original: <a href="/api/dss/bruto" target="_blank">/api/dss/bruto</a> · API: <a href="/api/navios" target="_blank">/api/navios</a> · <a href="/api/resumo" target="_blank">/api/resumo</a> · <a href="/api/mudancas?horas=168" target="_blank">/api/mudancas</a> · <a href="/api/alertas" target="_blank">/api/alertas</a></p>
    <p class="suave" id="alertas"></p>
  </section>
</main>

<dialog id="detalhe">
  <div class="detalhe-topo">
    <div id="detalhe-titulo"></div>
    <button class="leve" type="button" id="fechar">Fechar</button>
  </div>
  <div class="detalhe-corpo" id="detalhe-corpo"></div>
</dialog>

<script>
  const $ = (s) => document.querySelector(s);
  const esc = (v) => String(v ?? '—').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const fmt = new Intl.DateTimeFormat('pt-BR', { timeZone: 'America/Sao_Paulo', day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
  const data = (iso) => (iso ? fmt.format(new Date(iso)).replace(',', '') : '—');
  const ROTULO = {
    previsto: ['Previsto', 'azul'], aguardando_atracacao: ['Aguardando atracação', 'amarelo'], chegada_passou: ['Chegada passou', 'cinza'], atracado: ['Atracado', 'laranja'], encerrado: ['Encerrado', 'cinza'],
    aguardando: ['Aguardando', 'azul'], aberto: ['Aberto', 'verde'], sem_dado: ['Sem dado', 'cinza'], liberado: ['Liberado', 'verde'], atrasado: ['Atrasado', 'vermelho'],
  };
  const pill = (v, rotulo) => { const [t, c] = ROTULO[v] || [v, 'cinza']; return `<span class="pill ${c}">${esc(rotulo || t)}</span>`; };
  const h = (n) => (!n ? '' : ` <span class="suave">(${n > 0 ? '+' : ''}${n} h)</span>`);
  const prevReal = (prev, real, atraso) => (real ? `${data(real)}${h(atraso)}` : prev ? `<span class="suave">prev.</span> ${data(prev)}` : '—');
  const PROBLEMAS = {
    data_real_no_futuro: 'data "real" no futuro tratada como prevista',
    reefer_e_abertura_de_gate: 'liberação reefer do DSS lida como abertura de gate reefer',
    armador_igual_viagem: 'armador do DSS era a viagem',
    armador_invalido: 'armador do DSS inválido',
    data_suspeita: 'data a mais de 1 ano descartada',
    saida_sem_atracacao: 'saída prevista passou sem atracação informada pelo terminal',
  };
  const ajustes = (n) => {
    const itens = n.qualidade.filter((q) => PROBLEMAS[q.problema]);
    return itens.length ? ` <span class="pill amarelo" title="${esc(itens.map((q) => `${q.campo}: ${PROBLEMAS[q.problema]}${q.valor ? ` (${q.valor})` : ''}`).join('\n'))}">dados ajustados</span>` : '';
  };
  const terminal = (t) => ({ btp: 'BTP', santos_brasil: 'Santos Brasil', embraport: 'Embraport (DPW)' }[t] || t || '—');

  // ---- histórico de mudanças
  // Mesma chave do servidor: terminal|NAVIO|VIAGEM, só letras e números.
  const so = (v) => String(v ?? '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  const chave = (i) => i.chave || `${String(i.terminal ?? '').trim().toLowerCase()}|${so(i.navio)}|${so(i.viagem)}`;
  const botaoNavio = (i) => `<button type="button" class="nome" data-chave="${esc(chave(i))}" title="Ver datas e histórico">${esc(i.navio)}</button>`;
  const dssIso = (v) => (v ? new Date(`${String(v).replace(' ', 'T')}Z`).toISOString() : null);
  const fmtHora = new Intl.DateTimeFormat('pt-BR', { timeZone: 'America/Sao_Paulo', day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
  function diferenca(ms) {
    const sinal = ms > 0 ? '+' : '−';
    const a = Math.abs(ms) / 36e5;
    const texto = a < 1 ? `${Math.round(a * 60)} min` : a < 48 ? `${Math.round(a)} h` : `${(a / 24).toLocaleString('pt-BR', { maximumFractionDigits: 1 })} dias`;
    return `<span class="pill ${ms > 0 ? 'laranja' : 'azul'}" title="${ms > 0 ? 'adiou' : 'antecipou'}">${sinal}${texto}</span>`;
  }
  const NO_REGISTRO = { novo: 'entrou na lista do DSS', removido: 'saiu da lista do DSS', voltou: 'voltou à lista do DSS' };
  function textoMudanca(m) {
    if (m.campo === 'registro') return `<span class="suave">${esc(NO_REGISTRO[m.para] || m.para)}</span>`;
    if (m.campo === 'armador') return `Armador: <span class="antigo">${esc(m.de)}</span><span class="seta">→</span><strong>${esc(m.para)}</strong>`;
    const de = dssIso(m.de);
    const para = dssIso(m.para);
    return `${esc(m.rotulo)}: ${de ? `<span class="antigo">${data(de)}</span>` : '<span class="suave">sem data</span>'}<span class="seta">→</span><strong>${para ? data(para) : 'sem data'}</strong>${de && para && de !== para ? ` ${diferenca(Date.parse(para) - Date.parse(de))}` : ''}`;
  }
  const AVISO_MEMORIA = '<p class="suave">O histórico está guardado em memória e recomeça quando o servidor reinicia. Para guardar de vez, configure DATABASE_URL no Render.</p>';

  let mostrarTodasMudancas = false;
  function mostrarMudancas(lista, tipo) {
    const datas = lista.filter((m) => m.campo !== 'registro');
    const lista_ = lista.filter((m) => m.campo === 'registro');
    const conta = (p) => lista_.filter((m) => m.para === p).length;
    const entradas = [conta('novo') && `${conta('novo')} entraram`, conta('removido') && `${conta('removido')} saíram`, conta('voltou') && `${conta('voltou')} voltaram`].filter(Boolean);
    const visiveis = mostrarTodasMudancas ? datas : datas.slice(0, 12);
    $('#mudancas').innerHTML =
      (datas.length
        ? `<ul class="mudancas">${visiveis.map((m) => `<li><span class="suave">${fmtHora.format(new Date(m.em)).replace(',', '')}</span> · ${botaoNavio(m)} <span class="suave">v. ${esc(m.viagem)} · ${esc(terminal(m.terminal))}</span><br>${textoMudanca(m)}</li>`).join('')}</ul>` +
          (datas.length > 12 ? `<button class="leve" type="button" id="todas-mudancas">${mostrarTodasMudancas ? 'Mostrar menos' : `Mostrar todas (${datas.length})`}</button>` : '')
        : '<p class="suave">Nenhuma data mudou nas últimas 24 horas nos navios filtrados.</p>') +
      (entradas.length ? `<p class="suave">Lista do DSS: ${entradas.join(', ')}.</p>` : '') +
      (tipo === 'memoria' ? AVISO_MEMORIA : '');
  }

  // ---- detalhe do navio
  const EVENTOS = [
    ['chegada', 'Chegada', 'prevChegada', null],
    ['atracacao', 'Atracação', 'prevAtracacao', 'atracacao'],
    ['gate', 'Abertura do gate dry', 'prevAberturaGate', 'aberturaGate'],
    ['gateReefer', 'Abertura do gate reefer', 'prevAberturaGateReefer', 'aberturaGateReefer'],
    ['deadline', 'Deadline', 'deadline', null],
    ['dry', 'Liberação dry', 'prevLiberacaoDry', 'liberacaoDry'],
    ['reefer', 'Liberação reefer', 'prevLiberacaoReefer', 'liberacaoReefer'],
    ['saida', 'Saída', 'prevSaida', null],
  ];
  const EVENTO_DO_CAMPO = {
    data_prev_chegada: 'chegada', data_prev_atracacao: 'atracacao', data_atracacao: 'atracacao', data_prev_saida: 'saida',
    data_prev_abertura_gate: 'gate', data_abertura_gate: 'gate', data_deadline: 'deadline', data_prev_lib_dry: 'dry', data_lib_dry: 'dry',
  };
  const eventoDe = (m) => EVENTO_DO_CAMPO[m.campo] || (/reefer/.test(m.campo) ? (/gate/i.test(m.rotulo) ? 'gateReefer' : 'reefer') : null);

  async function abrirDetalhe(ch) {
    const dlg = $('#detalhe');
    $('#detalhe-titulo').innerHTML = `<h2>${esc(ch.split('|')[1])}</h2>`;
    $('#detalhe-corpo').innerHTML = '<p class="suave">Carregando…</p>';
    if (!dlg.open) dlg.showModal();
    try {
      mostrarDetalhe(await api(`/api/navio?chave=${encodeURIComponent(ch)}`));
    } catch (e) {
      $('#detalhe-corpo').innerHTML = `<p class="erro">${esc(e.message)}</p>`;
    }
  }

  function mostrarDetalhe(d) {
    const n = d.navio;
    const ref = n || d.mudancas[0];
    $('#detalhe-titulo').innerHTML = `<h2 style="font-size:18px;margin:0">${esc(ref.navio)}</h2>
      <div class="suave">v. ${esc(ref.viagem)}${n ? ` · ${esc(n.armador)}` : ''} · ${esc(terminal(ref.terminal))}</div>
      ${n ? `<div style="margin-top:4px">${pill(n.situacao.navio)} ${pill(n.situacao.gate, `gate dry: ${(ROTULO[n.situacao.gate] || [n.situacao.gate])[0].toLowerCase()}`)}${ajustes(n)}</div>` : ''}`;

    let html = '';
    if (n) {
      const porEvento = {};
      for (const m of d.mudancas) { const e = eventoDe(m); if (e) porEvento[e] = (porEvento[e] || 0) + 1; }
      const agora = Date.now();
      const itens = EVENTOS.map(([id, rotulo, p, r]) => {
        const prev = n.datas[p];
        const real = r ? n.datas[r] : null;
        return { id, rotulo, prev, real, quando: real || prev };
      });
      const comData = itens.filter((i) => i.quando).sort((a, b) => a.quando.localeCompare(b.quando));
      const semData = itens.filter((i) => !i.quando);
      let marcouAgora = false;
      const linhas = [];
      for (const i of comData) {
        const passou = Date.parse(i.quando) <= agora;
        if (!passou && !marcouAgora) { linhas.push(`<li class="agora"><span class="ponto"></span><span>agora · ${data(new Date().toISOString())}</span></li>`); marcouAgora = true; }
        const estado = i.real
          ? `<span class="pill verde">realizado</span>${i.prev && i.prev !== i.real ? ` <span class="suave">previsto ${data(i.prev)}</span>` : ''}`
          : `<span class="suave">${passou ? 'previsto (já passou)' : 'previsto'}</span>`;
        const mudou = porEvento[i.id] ? ` <span class="pill laranja">mudou ${porEvento[i.id]}×</span>` : '';
        linhas.push(`<li class="${passou ? 'passou' : ''}"><span class="ponto"></span><span>${data(i.quando)}</span><span><strong>${i.rotulo}</strong> ${estado}${mudou}</span></li>`);
      }
      if (!marcouAgora) linhas.push(`<li class="agora"><span class="ponto"></span><span>agora · ${data(new Date().toISOString())}</span></li>`);
      html += `<h2>Sequência de datas</h2><ul class="sequencia">${linhas.join('')}</ul>`;
      if (semData.length) html += `<p class="suave">Sem data no DSS: ${semData.map((i) => i.rotulo).join(', ')}.</p>`;
    } else {
      html += '<p class="suave">Este navio não está mais na lista atual do DSS. Abaixo, o que ficou registrado no histórico.</p>';
    }

    html += '<h2>Histórico de mudanças</h2>';
    html += d.mudancas.length
      ? `<ul class="mudancas">${d.mudancas.map((m) => `<li><span class="suave">${fmtHora.format(new Date(m.em)).replace(',', '')}</span> · ${textoMudanca(m)}</li>`).join('')}</ul>`
      : '<p class="suave">Nenhuma mudança registrada para este navio.</p>';
    if (d.historico === 'memoria') html += AVISO_MEMORIA;
    $('#detalhe-corpo').innerHTML = html;
  }

  async function api(caminho) {
    const res = await fetch(caminho);
    const corpo = await res.json();
    if (!res.ok) throw new Error(corpo.erro || `HTTP ${res.status}`);
    return corpo;
  }

  function filtrosAtuais() {
    return new URLSearchParams([...new FormData($('#filtros'))].filter(([, v]) => v));
  }

  async function carregar(atualizar = false) {
    const q = filtrosAtuais();
    if (atualizar) q.set('atualizar', 'true');
    $('#status').textContent = 'Consultando…';
    try {
      const lista = await api(`/api/painel?${q}`);
      const { resumo } = lista;
      $('#status').innerHTML = `${lista.total} de ${lista.qtdRegistrosDss} atracações · DSS consultado ${data(lista.consultadoEm)}${lista.aviso ? `<div class="erro">${esc(lista.aviso)}</div>` : ''}`;
      preencherOpcoes('terminal', lista.terminais, terminal);
      preencherOpcoes('armador', lista.armadores);
      mostrarCartoes(resumo);
      mostrarProximas(resumo);
      ultimasMudancas = [lista.mudancas || [], lista.historico];
      mostrarMudancas(...ultimasMudancas);
      mostrarTabela(lista.navios);
      const al = lista.alertas;
      $('#alertas').innerHTML = al
        ? `Alertas por e-mail para ${esc(al.para.join(', '))}: deadlines em 24 h, gates abertos e datas que mudaram.${al.ultimoEnvio ? ` Último envio ${data(al.ultimoEnvio)}.` : ''}${al.erro ? ` <span class="erro">Falha no envio: ${esc(al.erro)}</span>` : ''}`
        : 'Alertas por e-mail desligados.';
    } catch (e) {
      $('#status').innerHTML = `<span class="erro">${esc(e.message)}</span>`;
      ['#cartoes', '#proximas', '#mudancas', '#tabela'].forEach((s) => ($(s).innerHTML = ''));
    }
  }

  function preencherOpcoes(nome, valores, rotulo = (v) => v) {
    const sel = $(`#filtros [name=${nome}]`);
    const atual = sel.value;
    sel.innerHTML = '<option value="">Todos</option>' + valores.map((v) => `<option value="${esc(v)}">${esc(rotulo(v))}</option>`).join('');
    sel.value = atual;
  }

  function mostrarCartoes(r) {
    const c = (n, texto, campo, valor) => `<button type="button" data-campo="${campo}" data-valor="${valor}"><strong>${n || 0}</strong>${texto}</button>`;
    $('#cartoes').innerHTML = [
      c(r.total, 'atracações', '', ''),
      c(r.porSituacao.previsto, 'previstas', 'situacao', 'previsto'),
      c(r.porSituacao.aguardando_atracacao, 'aguardando atracação', 'situacao', 'aguardando_atracacao'),
      c(r.porSituacao.atracado, 'atracados', 'situacao', 'atracado'),
      c(r.porGate.aberto, 'gates abertos', 'gate', 'aberto'),
      c(r.porGate.aguardando, 'gates a abrir', 'gate', 'aguardando'),
      c(r.deadlines.length, `deadlines em ${r.proximasHoras} h`, 'gate', 'aberto'),
      c(r.liberacoes.length, `liberações em ${r.proximasHoras} h`, '', ''),
    ].join('');
  }

  function mostrarProximas(r) {
    $('#janela').textContent = r.proximasHoras;
    const bloco = (titulo, itens, linha) => `<div><h2>${titulo}</h2>${itens.length ? `<ul>${itens.map((i) => `<li>${linha(i)}</li>`).join('')}</ul>` : '<p class="suave">Nada previsto.</p>'}</div>`;
    const nome = (i) => `${botaoNavio(i)} <span class="suave">v. ${esc(i.viagem)} · ${esc(terminal(i.terminal))}</span>`;
    $('#proximas').innerHTML = [
      bloco('Deadlines (gate aberto)', r.deadlines, (i) => `${data(i.deadline)} · ${nome(i)} <span class="suave">faltam ${i.horasRestantes} h</span>`),
      bloco('Aberturas de gate', r.aberturasGate, (i) => `${data(i.prevista)} · ${i.tipo} · ${nome(i)}`),
      bloco('Chegadas', r.chegadas, (i) => `${data(i.prevChegada)} · ${nome(i)}`),
      bloco('Atracações', r.atracacoes, (i) => `${data(i.prevAtracacao)} · ${nome(i)}`),
      bloco('Liberações de importação', r.liberacoes, (i) => `${data(i.prevista)} · ${i.tipo} · ${nome(i)}`),
      bloco('Aguardando atracação', r.aguardandoAtracacao, (i) => `${nome(i)} <span class="suave">há ${Math.round(i.horasDeEspera)} h (chegada ${data(i.esperadoEm)})</span>`),
      ...(r.atrasados.length ? [bloco('Liberações atrasadas', r.atrasados, (i) => `${nome(i)} ${i.situacao.dry === 'atrasado' ? pill('atrasado', 'dry') : ''}${i.situacao.reefer === 'atrasado' ? pill('atrasado', 'reefer') : ''}`)] : []),
    ].join('');
  }

  function mostrarTabela(navios) {
    const linhas = navios.map((n) => `<tr>
        <td>${botaoNavio(n)}${n.mudancas24h ? ` <span class="pill laranja" title="datas que mudaram nas últimas 24 h">mudou ${n.mudancas24h}×</span>` : ''}${ajustes(n)}<div class="suave">v. ${esc(n.viagem)} · ${esc(n.armador)}${n.armadorOrigem && n.armadorOrigem !== 'dss' ? ` <span title="armador deduzido pelo ${esc(n.armadorOrigem)}">(deduzido)</span>` : ''}</div></td>
        <td>${esc(terminal(n.terminal))}</td>
        <td>${pill(n.situacao.navio)}${n.horas.esperaAtracacao ? `<div class="suave">há ${Math.round(n.horas.esperaAtracacao)} h</div>` : ''}</td>
        <td>${data(n.datas.prevChegada)}</td>
        <td>${prevReal(n.datas.prevAtracacao, n.datas.atracacao, n.horas.atrasoAtracacao)}</td>
        <td>${data(n.datas.prevSaida)}${n.horas.estadia !== null ? `<div class="suave">${n.horas.estadia} h no berço</div>` : ''}</td>
        <td>${pill(n.situacao.gate)}<div>${prevReal(n.datas.prevAberturaGate, n.datas.aberturaGate, n.horas.atrasoAberturaGate)}</div></td>
        <td>${pill(n.situacao.gateReefer)}<div>${prevReal(n.datas.prevAberturaGateReefer, n.datas.aberturaGateReefer)}</div></td>
        <td>${data(n.datas.deadline)}${n.horas.ateDeadline !== null && n.situacao.gate === 'aberto' ? `<div class="suave">faltam ${n.horas.ateDeadline} h</div>` : ''}</td>
        <td>${pill(n.situacao.dry)}<div>${prevReal(n.datas.prevLiberacaoDry, n.datas.liberacaoDry, n.horas.atrasoLiberacaoDry)}</div></td>
        <td>${pill(n.situacao.reefer)}<div>${prevReal(n.datas.prevLiberacaoReefer, n.datas.liberacaoReefer, n.horas.atrasoLiberacaoReefer)}</div></td>
      </tr>`).join('');
    $('#tabela').innerHTML = `<div class="tabela"><table><thead><tr>
        <th>Navio</th><th>Terminal</th><th>Situação</th><th>Chegada prev.</th><th>Atracação</th><th>Saída prev.</th>
        <th>Gate dry</th><th>Gate reefer</th><th>Deadline</th><th>Liberação dry</th><th>Liberação reefer</th>
      </tr></thead><tbody>${linhas || '<tr><td colspan="11">Nenhuma atracação com esses filtros.</td></tr>'}</tbody></table></div>`;
  }

  $('#filtros').addEventListener('submit', (ev) => { ev.preventDefault(); carregar(); });
  $('#limpar').addEventListener('click', () => { $('#filtros').reset(); carregar(); });
  // Clicar num cartão mantém o período e a opção de encerrados, e troca só o filtro do cartão.
  function aplicarCartao(campo, valor) {
    for (const nome of ['terminal', 'armador', 'situacao', 'gate', 'navio']) $(`#filtros [name=${nome}]`).value = '';
    if (campo) $(`#filtros [name=${campo}]`).value = valor;
    if (campo === 'situacao' && valor === 'encerrado') $('#filtros [name=encerrados]').checked = true;
    carregar();
  }
  $('#atualizar').addEventListener('click', () => carregar(true));
  $('#cartoes').addEventListener('click', (ev) => {
    const b = ev.target.closest('button');
    if (!b) return;
    aplicarCartao(b.dataset.campo, b.dataset.valor);
  });
  let ultimasMudancas = [[], null];
  document.addEventListener('click', (ev) => {
    const b = ev.target.closest('button.nome[data-chave]');
    if (b) return abrirDetalhe(b.dataset.chave);
    if (ev.target.id === 'todas-mudancas') { mostrarTodasMudancas = !mostrarTodasMudancas; mostrarMudancas(...ultimasMudancas); }
  });
  $('#fechar').addEventListener('click', () => $('#detalhe').close());
  $('#detalhe').addEventListener('click', (ev) => { if (ev.target === $('#detalhe')) $('#detalhe').close(); });
  carregar();
  setInterval(() => carregar(), 5 * 60 * 1000);
</script>
</body>
</html>
