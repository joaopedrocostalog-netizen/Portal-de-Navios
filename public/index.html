<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portal de Navios</title>
  <style>
    :root {
      --fundo: #f6f7f9; --cartao: #fff; --texto: #1c2430; --suave: #5b6675; --borda: #dfe3e8; --destaque: #0b6e99; --destaque-texto: #fff;
      --erro: #b42318; --c-cinza: #eceff3; --t-cinza: #3d4654; --c-azul: #e3edfb; --t-azul: #1f4f8f; --c-amarelo: #fbf3c4; --t-amarelo: #6b5600;
      --c-laranja: #ffe3c7; --t-laranja: #7a3d00; --c-verde: #dcf3e2; --t-verde: #1d6236; --c-vermelho: #fde2e0; --t-vermelho: #8f1f17;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fundo: #12161c; --cartao: #1a2029; --texto: #e6e9ee; --suave: #9aa5b4; --borda: #2c3542; --destaque: #3fa3d1; --destaque-texto: #0b1218;
        --erro: #ff8a7a; --c-cinza: #262d38; --t-cinza: #c3cad4; --c-azul: #1f2f4a; --t-azul: #b9d1f5; --c-amarelo: #3f3708; --t-amarelo: #f3e39a;
        --c-laranja: #4a2c0c; --t-laranja: #ffcf9f; --c-verde: #163323; --t-verde: #a6e3bb; --c-vermelho: #43191a; --t-vermelho: #ffb9b2;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--fundo); color: var(--texto); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { max-width: 1280px; margin: 0 auto; padding: 20px 16px 48px; }
    header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 14px; }
    h1 { font-size: 21px; margin: 0; }
    h2 { font-size: 15px; margin: 0 0 8px; }
    .suave { color: var(--suave); font-size: 13px; }
    .erro { color: var(--erro); }
    section { background: var(--cartao); border: 1px solid var(--borda); border-radius: 10px; padding: 14px; margin-bottom: 14px; }
    .cartoes { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
    .cartoes button { text-align: left; background: var(--cartao); color: var(--texto); border: 1px solid var(--borda); border-radius: 8px; padding: 9px 11px; cursor: pointer; font: inherit; }
    .cartoes button:hover { border-color: var(--destaque); }
    .cartoes strong { display: block; font-size: 22px; }
    .colunas { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
    .colunas ul { margin: 0; padding-left: 18px; }
    .colunas li { margin-bottom: 3px; }
    form { display: flex; flex-wrap: wrap; gap: 8px; align-items: end; }
    label { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--suave); }
    input, select { font: inherit; padding: 6px 8px; border: 1px solid var(--borda); border-radius: 6px; background: var(--fundo); color: var(--texto); }
    button.acao { font: inherit; padding: 7px 13px; border: 0; border-radius: 6px; background: var(--destaque); color: var(--destaque-texto); cursor: pointer; }
    button.leve { font: inherit; padding: 6px 11px; border: 1px solid var(--borda); border-radius: 6px; background: transparent; color: var(--destaque); cursor: pointer; }
    .tabela { overflow-x: auto; margin-top: 10px; }
    table { border-collapse: collapse; width: 100%; font-size: 13px; }
    th, td { text-align: left; padding: 6px 7px; border-bottom: 1px solid var(--borda); vertical-align: top; white-space: nowrap; }
    th { color: var(--suave); font-weight: 500; position: sticky; top: 0; background: var(--cartao); }
    .pill { display: inline-block; padding: 0 7px; border-radius: 999px; font-size: 12px; white-space: nowrap; }
    .cinza { background: var(--c-cinza); color: var(--t-cinza); } .azul { background: var(--c-azul); color: var(--t-azul); }
    .amarelo { background: var(--c-amarelo); color: var(--t-amarelo); } .laranja { background: var(--c-laranja); color: var(--t-laranja); }
    .verde { background: var(--c-verde); color: var(--t-verde); } .vermelho { background: var(--c-vermelho); color: var(--t-vermelho); }
    a { color: var(--destaque); }
  </style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>Portal de Navios</h1>
      <div class="suave">API Portal de Navios do DSS · horários de Brasília</div>
    </div>
    <div class="suave" id="status">Carregando…</div>
  </header>

  <section>
    <div class="cartoes" id="cartoes"></div>
  </section>

  <section>
    <h2>Próximas <span id="janela">48</span> horas</h2>
    <div class="colunas" id="proximas"></div>
  </section>

  <section>
    <form id="filtros">
      <label>Terminal<select name="terminal"><option value="">Todos</option></select></label>
      <label>Armador<select name="armador"><option value="">Todos</option></select></label>
      <label>Navio<select name="situacao"><option value="">Todas</option><option value="previsto">Previsto</option><option value="aguardando_atracacao">Aguardando atracação</option><option value="chegada_passou">Chegada passou (sem dado de atracação)</option><option value="atracado">Atracado</option><option value="encerrado">Encerrado</option></select></label>
      <label>Gate<select name="gate"><option value="">Todos</option><option value="aguardando">Aguardando abertura</option><option value="aberto">Aberto</option><option value="encerrado">Encerrado</option><option value="sem_dado">Sem dado</option></select></label>
      <label>Busca (navio)<input name="navio" size="14" placeholder="MSC"></label>
      <label>Ordenar<select name="ordenar"><option value="referencia">Atracação</option><option value="chegada">Chegada</option><option value="deadline">Deadline</option><option value="navio">Navio</option></select></label>
      <button class="acao" type="submit">Filtrar</button>
      <button class="leve" type="button" id="limpar">Limpar</button>
      <button class="leve" type="button" id="atualizar">Consultar o DSS agora</button>
    </form>
    <div id="tabela"></div>
    <p class="suave">Resposta original: <a href="/api/dss/bruto" target="_blank">/api/dss/bruto</a> · API: <a href="/api/navios" target="_blank">/api/navios</a> · <a href="/api/resumo" target="_blank">/api/resumo</a></p>
  </section>
</main>

<script>
  const $ = (s) => document.querySelector(s);
  const esc = (v) => String(v ?? '—').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const fmt = new Intl.DateTimeFormat('pt-BR', { timeZone: 'America/Sao_Paulo', day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
  const data = (iso) => (iso ? fmt.format(new Date(iso)).replace(',', '') : '—');
  const ROTULO = {
    previsto: ['Previsto', 'azul'], aguardando_atracacao: ['Aguardando atracação', 'amarelo'], chegada_passou: ['Chegada passou', 'cinza'], atracado: ['Atracado', 'laranja'], encerrado: ['Encerrado', 'cinza'],
    aguardando: ['Aguardando', 'azul'], aberto: ['Aberto', 'verde'], sem_dado: ['Sem dado', 'cinza'], liberado: ['Liberado', 'verde'], atrasado: ['Atrasado', 'vermelho'],
  };
  const pill = (v, rotulo) => { const [t, c] = ROTULO[v] || [v, 'cinza']; return `<span class="pill ${c}">${esc(rotulo || t)}</span>`; };
  const h = (n) => (!n ? '' : ` <span class="suave">(${n > 0 ? '+' : ''}${n} h)</span>`);
  const prevReal = (prev, real, atraso) => (real ? `${data(real)}${h(atraso)}` : prev ? `<span class="suave">prev.</span> ${data(prev)}` : '—');
  const PROBLEMAS = {
    data_real_no_futuro: 'data "real" no futuro tratada como prevista',
    reefer_e_abertura_de_gate: 'liberação reefer do DSS lida como abertura de gate reefer',
    armador_igual_viagem: 'armador do DSS era a viagem',
    armador_invalido: 'armador do DSS inválido',
    data_suspeita: 'data a mais de 1 ano descartada',
  };
  const ajustes = (n) => {
    const itens = n.qualidade.filter((q) => PROBLEMAS[q.problema]);
    return itens.length ? ` <span class="pill amarelo" title="${esc(itens.map((q) => `${q.campo}: ${PROBLEMAS[q.problema]}${q.valor ? ` (${q.valor})` : ''}`).join('\n'))}">dados ajustados</span>` : '';
  };
  const terminal = (t) => ({ btp: 'BTP', santos_brasil: 'Santos Brasil', embraport: 'Embraport (DPW)' }[t] || t || '—');

  async function api(caminho) {
    const res = await fetch(caminho);
    const corpo = await res.json();
    if (!res.ok) throw new Error(corpo.erro || `HTTP ${res.status}`);
    return corpo;
  }

  function filtrosAtuais() {
    return new URLSearchParams([...new FormData($('#filtros'))].filter(([, v]) => v));
  }

  async function carregar(atualizar = false) {
    const q = filtrosAtuais();
    if (atualizar) q.set('atualizar', 'true');
    $('#status').textContent = 'Consultando…';
    try {
      const [lista, resumo] = await Promise.all([api(`/api/navios?${q}`), api(`/api/resumo?${q}`)]);
      $('#status').innerHTML = `${lista.total} de ${lista.qtdRegistrosDss} atracações · DSS consultado ${data(lista.consultadoEm)}${lista.aviso ? `<div class="erro">${esc(lista.aviso)}</div>` : ''}`;
      preencherOpcoes('terminal', lista.terminais, terminal);
      preencherOpcoes('armador', lista.armadores);
      mostrarCartoes(resumo);
      mostrarProximas(resumo);
      mostrarTabela(lista.navios);
    } catch (e) {
      $('#status').innerHTML = `<span class="erro">${esc(e.message)}</span>`;
      ['#cartoes', '#proximas', '#tabela'].forEach((s) => ($(s).innerHTML = ''));
    }
  }

  function preencherOpcoes(nome, valores, rotulo = (v) => v) {
    const sel = $(`#filtros [name=${nome}]`);
    const atual = sel.value;
    sel.innerHTML = '<option value="">Todos</option>' + valores.map((v) => `<option value="${esc(v)}">${esc(rotulo(v))}</option>`).join('');
    sel.value = atual;
  }

  function mostrarCartoes(r) {
    const c = (n, texto, campo, valor) => `<button type="button" data-campo="${campo}" data-valor="${valor}"><strong>${n || 0}</strong>${texto}</button>`;
    $('#cartoes').innerHTML = [
      c(r.total, 'atracações', '', ''),
      c(r.porSituacao.previsto, 'previstas', 'situacao', 'previsto'),
      c(r.porSituacao.aguardando_atracacao, 'aguardando atracação', 'situacao', 'aguardando_atracacao'),
      c(r.porSituacao.atracado, 'atracados', 'situacao', 'atracado'),
      c(r.porGate.aberto, 'gates abertos', 'gate', 'aberto'),
      c(r.porGate.aguardando, 'gates a abrir', 'gate', 'aguardando'),
      c(r.deadlines.length, `deadlines em ${r.proximasHoras} h`, 'gate', 'aberto'),
      c(r.liberacoes.length, `liberações em ${r.proximasHoras} h`, '', ''),
    ].join('');
  }

  function mostrarProximas(r) {
    $('#janela').textContent = r.proximasHoras;
    const bloco = (titulo, itens, linha) => `<div><h2>${titulo}</h2>${itens.length ? `<ul>${itens.map((i) => `<li>${linha(i)}</li>`).join('')}</ul>` : '<p class="suave">Nada previsto.</p>'}</div>`;
    const nome = (i) => `<strong>${esc(i.navio)}</strong> <span class="suave">v. ${esc(i.viagem)} · ${esc(terminal(i.terminal))}</span>`;
    $('#proximas').innerHTML = [
      bloco('Deadlines (gate aberto)', r.deadlines, (i) => `${data(i.deadline)} · ${nome(i)} <span class="suave">faltam ${i.horasRestantes} h</span>`),
      bloco('Aberturas de gate', r.aberturasGate, (i) => `${data(i.prevista)} · ${i.tipo} · ${nome(i)}`),
      bloco('Chegadas', r.chegadas, (i) => `${data(i.prevChegada)} · ${nome(i)}`),
      bloco('Atracações', r.atracacoes, (i) => `${data(i.prevAtracacao)} · ${nome(i)}`),
      bloco('Liberações de importação', r.liberacoes, (i) => `${data(i.prevista)} · ${i.tipo} · ${nome(i)}`),
      bloco('Aguardando atracação', r.aguardandoAtracacao, (i) => `${nome(i)} <span class="suave">há ${Math.round(i.horasDeEspera)} h (chegada ${data(i.esperadoEm)})</span>`),
      ...(r.atrasados.length ? [bloco('Liberações atrasadas', r.atrasados, (i) => `${nome(i)} ${i.situacao.dry === 'atrasado' ? pill('atrasado', 'dry') : ''}${i.situacao.reefer === 'atrasado' ? pill('atrasado', 'reefer') : ''}`)] : []),
    ].join('');
  }

  function mostrarTabela(navios) {
    const linhas = navios.map((n) => `<tr>
        <td><strong>${esc(n.navio)}</strong>${ajustes(n)}<div class="suave">v. ${esc(n.viagem)} · ${esc(n.armador)}${n.armadorOrigem && n.armadorOrigem !== 'dss' ? ` <span title="armador deduzido pelo ${esc(n.armadorOrigem)}">(deduzido)</span>` : ''}</div></td>
        <td>${esc(terminal(n.terminal))}</td>
        <td>${pill(n.situacao.navio)}${n.horas.esperaAtracacao ? `<div class="suave">há ${Math.round(n.horas.esperaAtracacao)} h</div>` : ''}</td>
        <td>${data(n.datas.prevChegada)}</td>
        <td>${prevReal(n.datas.prevAtracacao, n.datas.atracacao, n.horas.atrasoAtracacao)}</td>
        <td>${data(n.datas.prevSaida)}${n.horas.estadia !== null ? `<div class="suave">${n.horas.estadia} h no berço</div>` : ''}</td>
        <td>${pill(n.situacao.gate)}<div>${prevReal(n.datas.prevAberturaGate, n.datas.aberturaGate, n.horas.atrasoAberturaGate)}</div></td>
        <td>${pill(n.situacao.gateReefer)}<div>${prevReal(n.datas.prevAberturaGateReefer, n.datas.aberturaGateReefer)}</div></td>
        <td>${data(n.datas.deadline)}${n.horas.ateDeadline !== null && n.situacao.gate === 'aberto' ? `<div class="suave">faltam ${n.horas.ateDeadline} h</div>` : ''}</td>
        <td>${pill(n.situacao.dry)}<div>${prevReal(n.datas.prevLiberacaoDry, n.datas.liberacaoDry, n.horas.atrasoLiberacaoDry)}</div></td>
        <td>${pill(n.situacao.reefer)}<div>${prevReal(n.datas.prevLiberacaoReefer, n.datas.liberacaoReefer, n.horas.atrasoLiberacaoReefer)}</div></td>
      </tr>`).join('');
    $('#tabela').innerHTML = `<div class="tabela"><table><thead><tr>
        <th>Navio</th><th>Terminal</th><th>Situação</th><th>Chegada prev.</th><th>Atracação</th><th>Saída prev.</th>
        <th>Gate dry</th><th>Gate reefer</th><th>Deadline</th><th>Liberação dry</th><th>Liberação reefer</th>
      </tr></thead><tbody>${linhas || '<tr><td colspan="11">Nenhuma atracação com esses filtros.</td></tr>'}</tbody></table></div>`;
  }

  $('#filtros').addEventListener('submit', (ev) => { ev.preventDefault(); carregar(); });
  $('#limpar').addEventListener('click', () => { $('#filtros').reset(); carregar(); });
  $('#atualizar').addEventListener('click', () => carregar(true));
  $('#cartoes').addEventListener('click', (ev) => {
    const b = ev.target.closest('button');
    if (!b) return;
    $('#filtros').reset();
    if (b.dataset.campo) $(`#filtros [name=${b.dataset.campo}]`).value = b.dataset.valor;
    carregar();
  });
  carregar();
  setInterval(() => carregar(), 5 * 60 * 1000);
</script>
</body>
</html>
