# Blueprint do Render: cria a API (web service) e o banco PostgreSQL de uma vez.
# No Render: New > Blueprint > escolha este repositório.
# Endereço e login do DSS ficam com "sync: false": o Render pede o valor na criação e
# você pode alterar depois em  Dashboard > portal-de-navios > Environment.

services:
  - type: web
    name: portal-de-navios
    runtime: node
    plan: free
    region: virginia
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DSS_URL
        value: https://costalog.dssinformatica.com.br/wsdss/navios/listarNavios
      - key: DSS_USUARIO
        sync: false
      - key: DSS_SENHA
        sync: false
      - key: DIAS_PADRAO
        value: "7"
      - key: INTERVALO_TEMPO_REAL_MS
        value: "60000"
      - key: DATABASE_URL
        fromDatabase:
          name: portal-de-navios-db
          property: connectionString

databases:
  - name: portal-de-navios-db
    plan: free
    region: virginia
    databaseName: portal_navios
    user: portal_navios
