# Blueprint do Render. No Render: New > Blueprint > escolha este repositório.
# Login do DSS fica com "sync: false": o Render pede na criação; depois, em portal-de-navios > Environment.

services:
  - type: web
    name: portal-de-navios
    runtime: node
    plan: free
    region: virginia
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DSS_URL
        value: https://costalog.dssinformatica.com.br/wsdss/navios/listarNavios
      - key: DSS_USUARIO
        sync: false
      - key: DSS_SENHA
        sync: false
      - key: CACHE_SEGUNDOS
        value: "60"
